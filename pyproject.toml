[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-bench"
version = "1.0.0"
description = "Reproducible graph database cloud benchmarking suite for CognoDB Assignment 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.14,<6",
    "python-arango>=7.9,<8",
    "redis>=5.0,<6",
    "falkordb>=1.0.9,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "matplotlib>=3.8,<4",
    "tabulate>=0.9,<1",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.4,<1"]

[project.scripts]
graph-bench = "graph_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
